services:
  - type: web
    name: velo-demand-dashboard
    runtime: python
    buildCommand: python prepare_h3.py && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 900
    envVars:
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: DATA_DIR
        value: "data"
