<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velo Demand</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
#top{padding:14px 18px;background:white;border-bottom:1px solid #ddd}
#map{height:calc(100vh - 158px)}
button,input{font-size:14px;padding:8px 10px}
button{cursor:pointer}
#status{margin-top:8px;font-size:13px}
#bar{height:8px;background:#ddd;margin-top:7px;border-radius:5px;overflow:hidden}
#barFill{height:100%;width:0;background:#444;transition:width .25s}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
a{color:#1565c0}
.legend{background:white;padding:8px;line-height:20px;box-shadow:0 1px 4px #999}
</style>
</head>
<body>
<div id="top">
  <input id="file" type="file" accept=".geojson,application/geo+json">
  <button id="upload">Загрузить и рассчитать</button>
  <span id="status"></span>
  <div id="bar"><div id="barFill"></div></div>
  <div class="links" id="downloads" style="display:none"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
let map = L.map("map").setView([55.79,37.75], 11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

let layer;
let jobId;

function scoreColor(v){
  if(v == null || Number.isNaN(Number(v))) return "#ccc";
  v = Number(v);
  if(v >= 75) return "#b71c1c";
  if(v >= 50) return "#e53935";
  if(v >= 25) return "#ef9a9a";
  return "#ffcdd2";
}

function showResult(url){
  fetch(url).then(r=>r.json()).then(fc=>{
    if(layer) map.removeLayer(layer);
    layer = L.geoJSON(fc, {
      style: f => ({
        color: scoreColor(f.properties.score_3_periods),
        weight: 5,
        opacity: .85
      }),
      onEachFeature: (f, l) => {
        const p=f.properties||{};
        l.bindPopup(`
          <b>${p.name || "(без названия)"}</b><br>
          Тип: ${p.type || ""}<br>
          Статус: ${p.status || ""}<br>
          24.07: ${fmt(p["24_07"])}<br>
          25.07: ${fmt(p["25_07"])}<br>
          26.07: ${fmt(p["26_07"])}<br>
          3 периода: <b>${fmt(p.score_3_periods)}</b>
        `);
      }
    }).addTo(map);
    if(layer.getBounds().isValid()) map.fitBounds(layer.getBounds(), {padding:[20,20]});
  });
}

function fmt(v){
  return (v === null || v === undefined || v === "") ? "—" : Number(v).toFixed(1);
}

function setProgress(n,msg){
  $("barFill").style.width = n + "%";
  $("status").textContent = msg;
}

$("upload").onclick = async () => {
  const f=$("file").files[0];
  if(!f){alert("Выберите GeoJSON");return;}
  $("downloads").style.display="none";
  setProgress(0,"Загрузка...");
  const fd=new FormData();
  fd.append("file",f);

  const r=await fetch("/api/upload",{method:"POST",body:fd});
  const data=await r.json();
  if(!r.ok){setProgress(0,data.error||"Ошибка");return;}
  jobId=data.job_id;
  poll();
};

async function poll(){
  const r=await fetch("/api/status/"+jobId);
  const d=await r.json();
  setProgress(d.progress||0,d.message||"");

  if(d.status==="done"){
    const res=await fetch("/api/result/"+jobId).then(x=>x.json());
    showResult("/api/download/"+jobId+"/geojson");
    $("downloads").innerHTML=[
      ["GeoJSON","geojson"],["Итог CSV","summary"],["Все периоды","all"],
      ["24.07","24_07"],["25.07","25_07"],["26.07","26_07"]
    ].map(x=>`<a href="/api/download/${jobId}/${x[1]}">${x[0]}</a>`).join("");
    $("downloads").style.display="flex";
    $("status").textContent=`Готово. Велодорог: ${res.lanes}, H3-кандидатов: ${res.h3_candidates}, пересечений: ${res.intersections}`;
    return;
  }
  if(d.status==="error"){
    setProgress(0,"Ошибка: "+(d.error||"неизвестная ошибка"));
    return;
  }
  setTimeout(poll,1200);
}
</script>
</body>
</html>
